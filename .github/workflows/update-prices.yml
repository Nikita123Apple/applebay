name: Обновление цен

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: pip install -r scraper/requirements.txt

      - name: Сбор цен
        run: python scraper/scrape.py

      - name: Сохранение, если цены изменились
        run: |
          git config user.name "applebay-bot"
          git config user.email "bot@users.noreply.github.com"
          cp data/products.json /tmp/products.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/products.json data/products.json
            git add data/products.json
            if git diff --cached --quiet; then
              echo "Цены не изменились"
              exit 0
            fi
            git commit -m "Обновление цен $(date -u +'%Y-%m-%d %H:%M') UTC"
            if git push; then
              echo "Цены сохранены"
              exit 0
            fi
            echo "Репозиторий изменился во время работы, пробую ещё раз…"
            sleep 10
          done
          exit 1
